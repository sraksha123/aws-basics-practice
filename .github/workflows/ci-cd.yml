name: CI & CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: devops-app
permissions:
  contents: write
  packages: write
  
jobs:
  ci-test-build-scan:
    name: CI - Test, Build & Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Build Docker image
        run: |
            SHORT_SHA=$(git rev-parse --short HEAD)
            docker build --pull --no-cache \
            -t "${IMAGE_NAME}:${SHORT_SHA}" \
            -t "${IMAGE_NAME}:latest" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "${{ env.IMAGE_NAME }}:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Login to GitHub Container Registry
        if: vars.ENABLE_DOCKERHUB_PUSH == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Push image to ghcr.io
        if: vars.ENABLE_DOCKERHUB_PUSH == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          IMAGE_PATH="ghcr.io/${OWNER_LOWER}/${IMAGE_LOWER}"
          docker tag "${IMAGE_NAME}:latest" "${IMAGE_PATH}:${SHORT_SHA}"
          docker tag "${IMAGE_NAME}:latest" "${IMAGE_PATH}:latest"
          docker push "${IMAGE_PATH}:${SHORT_SHA}"
          docker push "${IMAGE_PATH}:latest"

  cd-deploy:
    name: CD - Deploy (Gated Until Enabled)
    needs: ci-test-build-scan
    if: vars.ENABLE_CD == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Update Kubernetes manifest image tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LOWER=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="ghcr.io/${OWNER_LOWER}/${IMAGE_LOWER}:${SHORT_SHA}"
          sed -i "s|image: .*|image: ${IMAGE_REF}|g" k8s/deployment.yaml
          grep "image:" k8s/deployment.yaml

      - name: Commit updated manifest to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if ! git diff --staged --quiet; then
            git commit -m "chore(cd): update image tag in k8s/deployment.yaml [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy placeholder (wire Kubernetes / EKS manifest update here in Phase 4)
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "CD enabled. Ready to roll out ${IMAGE_NAME}:${SHORT_SHA}"

